spring:
  application:
    name: document-intelligence-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/docintel}
    username: ${DATABASE_USER:docintel}
    password: ${DATABASE_PASSWORD:docintel}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
server:
  port: ${PORT:8080}

