services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: docintel
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel
    ports: ["5432:5432"]
    volumes: ["documents-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/docintel
      DATABASE_USER: docintel
      DATABASE_PASSWORD: docintel
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?Set JWT_ISSUER_URI to your OIDC issuer}
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:?Set a base64 encoded 32-byte key}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  documents-data:

